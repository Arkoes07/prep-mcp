name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published vulnerability fails CI even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go version
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
