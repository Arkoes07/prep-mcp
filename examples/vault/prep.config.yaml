tags_file: tags.md              # optional: allowed tags, written as `prefix/value` in backticks
commit_on_write: true           # commit each write when the vault is its git repo's root
author: "Claude <claude@local>" # author of those commits
# Frontmatter fields shown next to each document in list_docs and get_context,
# unless its type has its own show list.
summary_fields: [kind, stage, status]

# A file shows up in queries when its frontmatter's type is defined here.
# In filename, {slug} is the slug argument or the title, {date} the type's date
# field or today, and any other {name} is that frontmatter field, which must
# then be in required.
types:
  story:
    folder: stories
    filename: "{slug}.md"
    required: [title, tags, ownership]
  session:
    folder: sessions
    filename: "{date}-{kind}-{slug}.md"
    required: [kind, date]
  improvement:
    folder: improvements
    filename: "{slug}.md"
    required: [status, exit_criteria]
  week:
    folder: weeks
    filename: "{week}.md"
    required: [week]
  application:
    folder: applications
    filename: "{slug}.md"
    required: [company, role, stage, status]
    # Optional. Dates, since/until and sorting use this field instead of date. A
    # document without a date there is dated by its file's modification time.
    date_field: applied
    show: [stage, status, next_action, next_action_date] # optional: shown instead of summary_fields
  learning:
    folder: learning
    filename: "{slug}.md"
    required: [title, track]
  reference:
    folder: reference
    filename: "{slug}.md"
    required: [title]

context:                          # what get_context returns
  current_week_type: week
  current_week_field: week        # compared with the ISO week, for example 2026-W03
  open_items:
    - {type: improvement, where: {status: [open, improving]}}
    - {type: application, where: {status: [active]}}
  recent:
    - {type: session, limit: 5}
