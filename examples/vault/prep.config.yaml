tags_file: tags.md
commit_on_write: true
author: "Claude <claude@local>"
# Frontmatter fields shown next to each document in list_docs and get_context,
# unless its type has its own show list.
summary_fields: [kind, stage, status]

types:
  story:
    folder: stories
    filename: "{slug}.md"
    required: [title, tags, ownership]
  session:
    folder: sessions
    filename: "{date}-{kind}-{slug}.md"
    required: [kind, date]
  improvement:
    folder: improvements
    filename: "{slug}.md"
    required: [status, exit_criteria]
  week:
    folder: weeks
    filename: "{week}.md"
    required: [week]
  application:
    folder: applications
    filename: "{slug}.md"
    required: [company, role, stage, status]
    date_field: applied    # dates, since/until and sorting use this field instead of date
    show: [stage, status, next_action, next_action_date]
  learning:
    folder: learning
    filename: "{slug}.md"
    required: [title, track]
  reference:
    folder: reference
    filename: "{slug}.md"
    required: [title]

context:
  current_week_type: week
  current_week_field: week
  open_items:
    - {type: improvement, where: {status: [open, improving]}}
    - {type: application, where: {status: [active]}}
  recent:
    - {type: session, limit: 5}
