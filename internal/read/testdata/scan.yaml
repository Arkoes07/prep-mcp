# Expected result of Scan on a pristine temp copy of examples/vault (TestScan).
# Every typed document, and nothing else. Excluded on purpose:
#   CLAUDE.md          no frontmatter
#   prep.config.yaml   not markdown
#   templates/*        skipped folder
#
# date: the value of the `date` field, or "" when the document has none and
#       Date falls back to file mtime (DateFromMtime true).
# body_line: 1-based file line where the body starts. Omitted when the body is empty.
docs:
  - path: applications/acme-backend.md
    type: application
    title: acme-backend            # no title field: the filename stem
    date: ""
    tags: [company/acme]
    body_line: 10
    fields: {company: Acme Pay, role: Senior Backend Engineer, stage: interview, status: active}

  - path: improvements/buries-headline.md
    type: improvement
    title: Buries the headline
    date: ""
    tags: []
    body_line: 8
    fields: {status: open}

  - path: improvements/missing-tradeoff.md
